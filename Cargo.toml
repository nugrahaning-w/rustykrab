[workspace]
resolver = "2"

members = ["crates/rustykrab-ast", "crates/rustykrab-cli", "crates/rustykrab-compose","crates/rustykrab-core", "crates/rustykrab-generator", "crates/rustykrab-parser", "crates/rustykrab-swiftui", "crates/rustykrab-widget"]

[workspace.dependencies]

serde = { version = "1", features = ["derive"] }

serde_json = "1"

anyhow = "1"

thiserror = "2.0.18"

clap = { version = "4", features = ["derive"] }

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
